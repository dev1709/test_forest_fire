<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Algerian Forest Fire Guard</title>

    <!-- Google Fonts -->
    <link
        href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        /* Main Page */
        body {
            min-height: 100vh;
            width: 100%;
            overflow: hidden;

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 20px;
            position: relative;

            background: #07150d;
        }

        /* Cinematic Moving Forest Background */
        body::before {
            content: "";
            position: fixed;
            inset: -5%;
            z-index: 0;

            background:
                linear-gradient(110deg,
                    rgba(3, 18, 10, 0.65),
                    rgba(8, 30, 17, 0.30),
                    rgba(4, 16, 9, 0.65)),
                url('https://images.unsplash.com/photo-1448375240586-882707db888b?auto=format&fit=crop&w=2400&q=90') center center / cover no-repeat;

            transform-origin: center;

            animation: forestCamera 30s ease-in-out infinite alternate;

            will-change: transform, filter;
        }

        /* Moving Sunlight and Forest Mist */
        body::after {
            content: "";
            position: fixed;
            inset: -20%;
            z-index: 1;

            pointer-events: none;

            background:
                radial-gradient(ellipse at 25% 35%,
                    rgba(74, 222, 128, 0.22),
                    transparent 35%),
                radial-gradient(ellipse at 75% 65%,
                    rgba(249, 115, 22, 0.13),
                    transparent 35%),
                linear-gradient(115deg,
                    transparent 20%,
                    rgba(187, 247, 208, 0.09) 45%,
                    transparent 70%);

            background-size:
                150% 150%,
                150% 150%,
                200% 100%;

            animation: forestLight 18s ease-in-out infinite alternate;

            mix-blend-mode: screen;
        }

        /* Slow Cinematic Camera Movement */
        @keyframes forestCamera {

            0% {
                transform: scale(1.02) translate3d(0, 0, 0);
                filter: brightness(0.78) saturate(1.1);
            }

            50% {
                transform: scale(1.09) translate3d(-1%, 0.5%, 0);
                filter: brightness(0.92) saturate(1.25);
            }

            100% {
                transform: scale(1.13) translate3d(1%, -0.5%, 0);
                filter: brightness(0.82) saturate(1.15);
            }
        }

        /* Animated Forest Lighting */
        @keyframes forestLight {

            0% {
                background-position:
                    0% 20%,
                    100% 80%,
                    150% 50%;

                opacity: 0.55;
            }

            50% {
                opacity: 0.9;
            }

            100% {
                background-position:
                    100% 80%,
                    0% 20%,
                    -50% 50%;

                opacity: 0.7;
            }
        }

        .forest-heading {
            font-family: 'Cinzel', serif;
        }

        /* Main Glass Card */
        .glass-card {
            text-align: center;

            max-width: 820px;
            width: 100%;

            padding: 55px 40px;

            background: rgba(13, 35, 22, 0.78);

            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);

            border: 1px solid rgba(74, 222, 128, 0.3);
            border-radius: 24px;

            box-shadow:
                0 20px 50px rgba(0, 0, 0, 0.65),
                inset 0 0 20px rgba(34, 197, 94, 0.08);

            position: relative;
            z-index: 2;
        }

        /* Badge */
        .badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;

            background: rgba(34, 197, 94, 0.15);

            border: 1px solid rgba(74, 222, 128, 0.4);

            color: #4ade80;

            padding: 8px 18px;

            border-radius: 20px;

            font-size: 0.8rem;
            font-weight: 600;

            letter-spacing: 1.5px;
            text-transform: uppercase;

            margin-bottom: 25px;
        }

        /* Main Heading */
        h1 {
            font-size: 2.8rem;
            font-weight: 700;

            margin-bottom: 20px;

            line-height: 1.25;

            color: #f0fdf4;
        }

        .amber-text {
            color: #f97316;

            text-shadow:
                0 0 15px rgba(249, 115, 22, 0.4);
        }

        /* Description */
        p {
            font-size: 1.05rem;
            line-height: 1.7;

            color: #bbf7d0;

            margin-bottom: 35px;

            font-weight: 300;
        }

        /* Prediction Button */
        .btn-forest {
            display: inline-flex;
            align-items: center;
            gap: 12px;

            padding: 16px 36px;

            font-size: 0.9rem;
            font-weight: 700;

            letter-spacing: 1.2px;
            text-transform: uppercase;

            color: #ffffff;

            background: linear-gradient(135deg,
                    #166534 0%,
                    #ea580c 100%);

            border: 1px solid rgba(251, 146, 60, 0.3);

            border-radius: 14px;

            cursor: pointer;
            text-decoration: none;

            box-shadow:
                0 4px 20px rgba(234, 88, 12, 0.35);

            transition: all 0.3s ease;
        }

        .btn-forest:hover {
            transform: translateY(-2px);

            box-shadow:
                0 6px 25px rgba(234, 88, 12, 0.55);

            background: linear-gradient(135deg,
                    #15803d 0%,
                    #f97316 100%);
        }

        .btn-forest i {
            transition: transform 0.3s ease;
        }

        .btn-forest:hover i {
            transform: translateX(5px);
        }

        /* Mobile Responsive */
        @media (max-width: 600px) {

            h1 {
                font-size: 2rem;
            }

            p {
                font-size: 0.95rem;
            }

            .glass-card {
                padding: 35px 20px;
            }

            .badge {
                font-size: 0.65rem;
                letter-spacing: 1px;
            }

            .btn-forest {
                padding: 14px 24px;
                font-size: 0.8rem;
            }

            body::before {
                background-position: center;
            }
        }

        /* Accessibility */
        @media (prefers-reduced-motion: reduce) {

            body::before,
            body::after {
                animation: none;
            }

            .btn-forest,
            .btn-forest i {
                transition: none;
            }
        }
    </style>
</head>

<body>

    <!-- Main Content -->
    <div class="glass-card">

        <span class="badge">
            <i class="fa-solid fa-tree"></i>
            Wildfire Analytics & Intelligence
        </span>

        <h1 class="forest-heading">
            ALGERIAN FOREST FIRE <br>
            <span class="amber-text">RISK PREDICTOR</span>
        </h1>

        <p>
            An end-to-end predictive system using Ridge Regression to estimate
            Fire Weather Index (FWI) components and wildfire danger based on
            meteorological parameters like Temperature, Humidity, and Wind Speed.
        </p>

        <a href="/predictdata" class="btn-forest">
            Predict Fire Risk
            <i class="fa-solid fa-arrow-right"></i>
        </a>

    </div>

</body>

</html>
